worker_processes auto;
error_log /var/log/nginx/bannedbyabrejeet_error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    # Upstreams distribuidos
    upstream backend_a_fastapi {
        # Máquina de Abrego
        server 192.168.220.123:8000;
    }

    upstream frontend_a_react {
        # Máquina de Abrego
        server 192.168.220.123:3000;
    }

    upstream backend_b_engine {
        # Local en la máquina de Mulet
        server 127.0.0.1:3001;
    }

    server {
        listen 80;
        server_name localhost 192.168.220.127;

        # 1. API Backend A (FastAPI / Auth / Whitelist / Config - Abrego)
        location /api/v1/ {
            proxy_pass http://backend_a_fastapi/api/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 2. Documentación Swagger OpenAPI de FastAPI (Abrego)
        location /docs {
            proxy_pass http://backend_a_fastapi/docs;
            proxy_set_header Host $host;
        }

        location /openapi.json {
            proxy_pass http://backend_a_fastapi/openapi.json;
        }

        # 3. Backend B (Motor de Seguridad & Simulador - Mulet)
        # proxy_pass SIN barra final: conserva el prefijo /api/security/
        # (el backend B expone /api/security/health y /api/security/simulate-log)
        location /api/security/ {
            proxy_pass http://backend_b_engine;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 4. Frontend A (React Vite SPA - Abrego)
        location / {
            proxy_pass http://frontend_a_react/;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
